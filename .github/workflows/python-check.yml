name: Python check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt
      - name: Compile
        run: python -m compileall .\grab_hongbao.py .\vision.py .\reporting.py .\enhanced.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Show CLI help
        run: python .\grab_hongbao.py --help
